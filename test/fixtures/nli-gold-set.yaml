# NLI equivalence gold set — FROZEN regression suite (do not use to design heuristics).
#
# Purpose: NLI safety regression only (false-merge rate = 0, block recall).
# Pipeline KPIs (M3 excess, HITL rate, off-contract) are measured separately
# via scripts/ops/report-pipeline-metrics.ts and held-out fixtures.
#
# Categories (expectedAction):
#   paraphrase          — same fact, lexical drift → auto_merge (governance approve)
#   false_positive_trap — looks similar, different fact → no_merge (must NOT auto-merge)
#   contradiction       — explicit negation / incompatible values → block_contradiction
#   refutation          — strong evidence overturning an established fact → block_refutation
#   ambiguous_hitl      — accrual, partial overlap, indeterminate → hitl (reject auto-merge)
#
# Pairs are mined from S1–S5 manifest claims and real LLM extraction patterns.
# Typed dimensions (S1 currency/percentage) included as negative controls: NLI
# should not be the primary resolver — canonical parsers handle them first.

schemaVersion: "1"
minConfidenceDefault: 0.7

pairs:
  # ── S1 M&A — paraphrase (auto_merge) ──────────────────────────────────────
  - id: s1-arr-paraphrase-01
    scenario: s1
    dimension: arr
    category: paraphrase
