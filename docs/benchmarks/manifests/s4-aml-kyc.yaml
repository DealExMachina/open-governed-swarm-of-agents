agentRoles:
- id: kyc
  name: KYC Analyst
  responsibility: CDD/EDD, UBO, risk rating
  systemPrompt: You are a KYC analyst. Extract client identity, UBOs, risk scores, and EDD findings. Preserve
    bitemporal rating history.
- id: tm
  name: Transaction Monitoring Analyst
  responsibility: Baselines, anomalies, SAR
  systemPrompt: You are a transaction monitoring analyst. Extract baselines, anomaly alerts, and SAR filing
    decisions.
- id: sanctions
  name: Sanctions / Screening Analyst
  responsibility: Sanctions, PEP, adverse media
  systemPrompt: You are a sanctions and screening analyst. Extract PEP hits, sanctions results, and adverse
    media alerts.
- id: privacy
  name: DPO / Privacy Counsel
  responsibility: GDPR erasure vs AML retention
  systemPrompt: You are privacy counsel. Extract GDPR Art. 17 requests and resolutions against AML retention
    duties.
