packages:
  - "packages/*"

# Security overrides. pnpm 10+ reads these from pnpm-workspace.yaml (the
# package.json "pnpm.overrides" field is no longer honoured). Ranges pin
# transitive dependencies to the first patched version reported by Dependabot.
overrides:
  esbuild: ">=0.28.1"
  hono: ">=4.12.34"
  "@hono/node-server": ">=1.19.15"
  fast-xml-parser: ">=5.10.1"
  fast-uri: ">=3.1.5 <4"
  ip-address: ">=10.3.1"
  flatted: ">=3.4.0"
  path-to-regexp: ">=0.1.13"
  picomatch: ">=4.0.4"
  next: ">=16.2.6"
  protobufjs: ">=8.6.0"
  "@protobufjs/utf8": ">=1.1.1"
  "@grpc/grpc-js": ">=1.14.4"
  ws: ">=8.21.0"
  qs: ">=6.15.2"
  postcss: ">=8.5.23"
  "nanoid@3": ">=3.3.18"
  tmp: ">=0.2.6"
  vite: ">=6.4.3 <7"
  js-yaml: ">=4.3.1 <5"
  "brace-expansion@1": "1.1.18"
  "brace-expansion@2": "2.1.4"
  "brace-expansion@5": "5.0.9"
  langsmith: ">=0.6.0"
  uuid: ">=11.1.1 <12"
  "@opentelemetry/core": ">=2.8.0"
  "@opentelemetry/exporter-prometheus": ">=0.217.0"
  "@opentelemetry/auto-instrumentations-node": ">=0.75.0"
  "@opentelemetry/propagator-jaeger": ">=2.9.0"
  body-parser: ">=2.3.0"
