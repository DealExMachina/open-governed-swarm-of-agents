packages:
  - "packages/*"

# Security overrides. pnpm 10 reads these from pnpm-workspace.yaml (the
# package.json "pnpm.overrides" field is no longer honoured). Ranges pin
# transitive dependencies to the first patched version reported by Dependabot.
overrides:
  esbuild: ">=0.28.1"
  hono: ">=4.12.25"
  fast-xml-parser: ">=5.7.0"
  fast-uri: ">=3.1.2 <4"
  flatted: ">=3.4.0"
  path-to-regexp: ">=0.1.13"
  picomatch: ">=4.0.4"
  next: ">=16.2.6"
  protobufjs: ">=8.6.0"
  "@protobufjs/utf8": ">=1.1.1"
  "@grpc/grpc-js": ">=1.14.4"
  ws: ">=8.21.0"
  qs: ">=6.15.2"
  postcss: ">=8.5.10"
  tmp: ">=0.2.6"
  vite: ">=6.4.3 <7"
  js-yaml: ">=4.2.0 <5"
  langsmith: ">=0.6.0"
  jsondiffpatch: ">=0.7.2"
  uuid: ">=11.1.1 <12"
  "@opentelemetry/core": ">=2.8.0"
  "@opentelemetry/exporter-prometheus": ">=0.217.0"
  "@opentelemetry/auto-instrumentations-node": ">=0.75.0"
